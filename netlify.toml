[build]
  command = "php artisan config:clear"
  publish = "public"

[functions]
  directory = "netlify/functions"
  included_files = ["vendor/**", "bootstrap/**", "app/**", "config/**", "resources/views/**", "routes/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true